<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FITS-fetcher</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>FITS-fetcher</h1>
    <span id="version" class="muted"></span>
    <button id="open-settings" class="secondary">Settings</button>
    <button id="quit" class="secondary" title="Stop the FITS-fetcher server">Quit</button>
  </header>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form" novalidate>
      <h2 id="settings-title">Settings</h2>
      <p id="settings-error" class="error" hidden></p>
      <div id="settings-fields"></div>
      <div class="row dialog-buttons">
        <button type="button" id="settings-reset" class="secondary">Reset to defaults</button>
        <span class="grow"></span>
        <button type="button" id="settings-cancel" class="secondary">Cancel</button>
        <button type="submit" id="settings-save">Save</button>
      </div>
    </form>
  </dialog>

  <main>
    <section class="panel" id="search-panel">
      <h2>Search</h2>
      <form id="resolve-form" class="row">
        <label class="grow">Object name, designation or RA/Dec
          <input id="name" type="text" placeholder="e.g. M51, Whirlpool Galaxy, NGC 7293, 202.47 47.195" autocomplete="off" required>
        </label>
        <button type="submit">Find object</button>
      </form>

      <div id="candidates" hidden>
        <p>Several objects match. Choose one:</p>
        <ul id="candidate-list" class="choices"></ul>
      </div>

      <div id="target" class="target" hidden></div>
      <p id="resolve-error" class="error" hidden></p>

      <fieldset>
        <legend>Archives</legend>
        <div id="archive-boxes" class="row wrap"></div>
      </fieldset>

      <fieldset>
        <legend>Colour sets</legend>
        <div class="row wrap">
          <label>Minimum filters <input id="min-filters" type="number" min="2" value="3"></label>
          <label class="check"><input id="mix" type="checkbox"> Allow mixing instruments and archives</label>
          <label>Filter type
            <select id="band-type">
              <option value="either">Broadband or narrowband</option>
              <option value="broad">Broadband only</option>
              <option value="narrow">Narrowband only</option>
            </select>
          </label>
        </div>
        <div class="row wrap" id="line-boxes" aria-label="Emission lines"></div>
        <label class="check"><input id="hst-mosaics" type="checkbox"> Also show HST mosaics (cut around the object)</label>
      </fieldset>

      <div class="row">
        <button id="search" disabled>Search</button>
        <button id="cancel" class="secondary" hidden>Cancel</button>
      </div>
      <ul id="archive-status" class="status"></ul>
    </section>

    <section class="panel" id="results-panel" hidden>
      <h2>Results</h2>
      <p id="results-summary" class="muted"></p>
      <div id="results"></div>
      <div id="inside" class="inside" hidden></div>
      <div class="download-bar">
        <p id="selection-summary" class="muted">Nothing selected.</p>
        <div class="row wrap">
          <label class="check"><input id="opt-repair" type="checkbox"> Repair star cores</label>
          <label class="check"><input id="opt-cutout" type="checkbox"> <span id="opt-cutout-label">Cut around the object</span></label>
          <label class="check unavailable"><input type="checkbox" disabled> Reproject onto a common grid (not built yet)</label>
          <span class="grow"></span>
          <button id="download" disabled>Download selected</button>
          <button id="download-cancel" class="secondary" hidden>Cancel download</button>
        </div>
        <div id="download-progress" class="row wrap" hidden>
          <progress id="overall" max="1" value="0"></progress>
          <span id="overall-text" class="muted"></span>
        </div>
        <div id="download-summary" class="row wrap" hidden>
          <span id="download-summary-text"></span>
          <button id="open-folder" class="secondary">Open folder</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
